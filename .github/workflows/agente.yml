name: agente-instagram

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "15 12-23 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "gerar ou publicar"
        default: "gerar"

permissions:
  contents: write

concurrency: agente-instagram

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Define o modo
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "m=${{ inputs.modo }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then
            echo "m=gerar" >> "$GITHUB_OUTPUT"
          else
            echo "m=publicar" >> "$GITHUB_OUTPUT"
          fi

      - name: Executa o agente
        run: python agente_instagram.py ${{ steps.modo.outputs.m }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          BRANCH: ${{ github.ref_name }}

      - name: Salva alterações no repositório
        if: always()
        run: |
          git config user.name "agente"
          git config user.email "agente@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "atualiza agente" && git push)
